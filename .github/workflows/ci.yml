name: CI

on:
  push:
    tags:
      - "v*"
      - "!v*-rc*"
      - "!v*.rc*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Interrupting an FTP sync can leave the remote manifest ahead of the uploaded files.
  cancel-in-progress: false

jobs:
  registry-consumers:
    uses: ./.github/workflows/registry.yml
    permissions:
      contents: read

  verify-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: ⬇️ Get latest code
        uses: actions/checkout@v7

      - name: 📦 Get pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.23.0

      - name: ⬇️ Get Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧹 Lint and type-check
        run: pnpm lint

      - name: 🧪 Test
        run: pnpm test

      - name: 🏗️ Build production server
        run: pnpm build

      - name: 📄 Render static FTP entry
        run: pnpm prerender:static

      - name: ⬆️ Upload FTP
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./.output/public/
          server-dir: ./
          # The previous manifest was left inconsistent by an interrupted deployment.
          state-name: .ftp-deploy-sync-state-tanstack.json

  publish-release:
    needs: [verify-and-deploy, registry-consumers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Publish GitHub release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          node --test scripts/release-notes.test.mjs
          node scripts/release-notes.mjs "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if printf '%s\n' "$releases" | grep -Fxq "$RELEASE_TAG"; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
